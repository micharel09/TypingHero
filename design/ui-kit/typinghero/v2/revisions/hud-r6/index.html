<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUD r6</title>
<style>body{background:#14111e;color:#f2e7cf;font:16px system-ui;margin:20px}a{color:#afa1b3}select{font:inherit}main{display:flex;gap:16px;flex-wrap:wrap}figure{margin:16px 0;max-width:100%;overflow:auto}img{image-rendering:pixelated;display:block}figcaption{margin-bottom:8px}label{display:inline-block;margin:8px}</style>
<h1>HUD r6 · kim loại tối</h1><p>Review tĩnh r5–r6 · cùng bố cục, chữ và fill. <a href="README.md">Mapping và kết quả kiểm</a> · <a href="contract.md">Contract</a></p>
<label>Trạng thái <select id="state"><option>normal</option><option>correct</option><option>error</option><option>slayer</option><option>elite</option><option>boss</option><option>low-hp</option><option>normal-normal-hp0</option><option>normal-normal-hp1</option><option>normal-normal-hp50</option><option>normal-normal-hp100</option><option>normal-slayer-hp0</option><option>normal-slayer-hp1</option><option>normal-slayer-hp50</option><option>normal-slayer-hp100</option><option>elite-normal-hp0</option><option>elite-normal-hp1</option><option>elite-normal-hp50</option><option>elite-normal-hp100</option><option>elite-slayer-hp0</option><option>elite-slayer-hp1</option><option>elite-slayer-hp50</option><option>elite-slayer-hp100</option><option>boss-normal-hp0</option><option>boss-normal-hp1</option><option>boss-normal-hp50</option><option>boss-normal-hp100</option><option>boss-slayer-hp0</option><option>boss-slayer-hp1</option><option>boss-slayer-hp50</option><option>boss-slayer-hp100</option></select></label><label>Phóng <select id="scale"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><label><input id="gray" type="checkbox"> Grayscale</label>
<main><figure><figcaption>R5 · giữ nguyên vật liệu</figcaption><img id="old" alt="HUD r5" width="320" height="180"></figure><figure><figcaption>R6 · bevel và lòng lõm</figcaption><img id="new" alt="HUD r6" width="320" height="180"></figure></main>
<script>const state=document.querySelector('#state'),scale=document.querySelector('#scale'),gray=document.querySelector('#gray');function update(){const s=+scale.value;for(const [id,r] of [['old',5],['new',6]]){const im=document.getElementById(id);im.src=`preview/r${r}-${state.value}-${320*s}x${180*s}.png`;im.width=320*s;im.height=180*s;im.style.filter=gray.checked?'grayscale(1)':''}}document.querySelectorAll('select,input').forEach(e=>e.addEventListener('change',update));update()</script></html>
