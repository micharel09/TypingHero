const $=id=>document.getElementById(id);
let frame=0,playing=true,elapsed=0,last=null,ready=false;
const sprites={},sources=[];
function load(url){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url;});}
function range(){return $('clip').value==='Timeline'?[0,57]:data.clips[$('kind').value][$('clip').value];}
function render(){
 const k=$('kind').value,index=data.kinds.indexOf(k),[ox,oy]=data.origins[index],z=+$('zoom').value;
 const [start,end]=range();$('scrub').min=start;$('scrub').max=end;$('scrub').value=frame;
 $('status').textContent=` Nguồn ${frame}/57 · clip ${frame-start+1}/${end-start+1} · ${(frame*100/1000).toFixed(1)}s`;
 $('play').textContent=playing?'Pause':'Resume';
 for(const id of ['source','export','overlay']){
  const canvas=$(id);canvas.width=96*z;canvas.height=64*z;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
  if($('mirror').checked){ctx.translate(canvas.width,0);ctx.scale(-1,1);}
  if(id!=='export')ctx.drawImage(sources[frame],ox,oy,96,64,0,0,96*z,64*z);
  if(id!=='source'){ctx.globalAlpha=id==='overlay'?.5:1;ctx.drawImage(sprites[k][frame],0,0,96*z,64*z);}
 }
}
function reset(){frame=range()[0];elapsed=0;last=null;render();}
function step(delta){playing=false;elapsed=0;frame=Math.max(range()[0],Math.min(range()[1],frame+delta));render();}
$('play').onclick=()=>{playing=!playing;last=null;render();};
$('replay').onclick=()=>{playing=true;reset();};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('scrub').oninput=()=>{playing=false;frame=+$('scrub').value;elapsed=0;render();};
for(const id of ['kind','clip'])$(id).onchange=reset;
for(const id of ['mirror','zoom'])$(id).onchange=render;
$('speed').onchange=()=>{last=null;};
function tick(time){if(last!==null&&playing){elapsed+=(time-last)*+$('speed').value;const n=Math.floor(elapsed/100);if(n){elapsed-=n*100;const [start,end]=range();frame=start+(frame-start+n)%(end-start+1);render();}}last=time;requestAnimationFrame(tick);}
(async()=>{for(const kind of data.kinds)sprites[kind]=await Promise.all(data.frames[kind].map(load));sources.push(...await Promise.all(data.source.map(load)));ready=true;render();requestAnimationFrame(tick);})();
