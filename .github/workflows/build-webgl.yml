name: Build WebGL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-webgl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add the $name repository secret in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Build WebGL
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: build
          versioning: None

      - name: Check playable build
        run: test -s build/WebGL/index.html

      - name: Upload WebGL ZIP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TypingHero-WebGL-${{ github.sha }}
          path: build/WebGL/
          if-no-files-found: error
          retention-days: 3
