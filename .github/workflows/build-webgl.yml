name: Build WebGL

on:
  workflow_dispatch:
    inputs:
      serialize_only:
        description: Import and serialize pixel UI without rebuilding WebGL
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-webgl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check Unity license secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_EMAIL UNITY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add the $name repository secret in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify Unity account login
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          payload = json.dumps({
              "username": os.environ["UNITY_EMAIL"],
              "password": os.environ["UNITY_PASSWORD"],
              "grant_type": "password",
          }).encode()
          request = urllib.request.Request(
              "https://core.cloud.unity3d.com/api/login",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"Unity account login HTTP {response.status}")
          except urllib.error.HTTPError as error:
              print(f"::error::Unity account login HTTP {error.code}; no credentials or response tokens logged.")
              raise SystemExit(1)
          except urllib.error.URLError:
              print("::error::Unity account login could not reach Unity.")
              raise SystemExit(1)
          PY

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Build WebGL
        id: unity-build
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          cliVersion: v0.1.72
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: build
          versioning: None
          buildMethod: ${{ inputs.serialize_only && 'PixelUIBuild.SerializeOnly' || '' }}

      - name: Check playable build
        if: ${{ !inputs.serialize_only }}
        run: |
          test -s build/WebGL/WebGL/index.html
          sudo cp Assets/Art/Environment/TinyPixelJapan/CREDITS.txt build/WebGL/WebGL/CREDITS.txt
          cat Assets/Audio/SFX/Clips/KenneyImpact/CREDITS.txt Assets/Audio/SFX/Clips/KenneyUI/CREDITS.txt Assets/Art/VFX/Pimen/CREDITS.txt | sudo tee -a build/WebGL/WebGL/CREDITS.txt > /dev/null
          sudo mkdir -p build/WebGL/WebGL/Licenses
          sudo cp Assets/Art/UI/Pixel/*License.txt Assets/Art/UI/Pixel/VT323-OFL.txt build/WebGL/WebGL/Licenses/
          sudo cp Assets/Art/UI/DarkAges/LICENSE.txt build/WebGL/WebGL/Licenses/DarkAges-License.txt
          sudo cp Assets/Art/Environment/TinyPixelJapan/LICENSE.txt build/WebGL/WebGL/Licenses/TinyPixelJapan-License.txt
          sudo cp Assets/Audio/SFX/Clips/KenneyImpact/License.txt build/WebGL/WebGL/Licenses/Kenney-Impact-License.txt
          sudo cp Assets/Audio/SFX/Clips/KenneyUI/License.txt build/WebGL/WebGL/Licenses/Kenney-UI-License.txt
          sudo cp Assets/Art/VFX/Pimen/*License.txt build/WebGL/WebGL/Licenses/

      - name: Upload Unity serialized pixel UI
        if: ${{ always() && steps.unity-build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CLACKBLADE-PixelUI-${{ github.sha }}
          path: build/PixelUI/
          if-no-files-found: error
          retention-days: 3

      - name: Upload WebGL ZIP artifact
        if: ${{ always() && !inputs.serialize_only && steps.unity-build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CLACKBLADE-WebGL-${{ github.sha }}
          path: build/WebGL/WebGL/
          if-no-files-found: error
          retention-days: 3
