<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=630, initial-scale=1">
<title>Typing Hero — itch.io cover</title>
<style>
  @font-face { font-family: VT323; src: url('../../Assets/Art/UI/Pixel/VT323-Regular.ttf'); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 630px; height: 500px; overflow: hidden; background: #0c1622; }

  .fight { display: block; width: 582px; height: 304px; border: 1px solid #496576; background: black; }

<main>
  <h1>TYPING HERO</h1>
  <div class="controls"><kbd>TYPE</kbd> SLASH <span class="divider">/</span> <kbd>SPACE</kbd> PARRY</div>
