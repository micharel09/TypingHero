<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=960, initial-scale=1">
<title>Typing Hero — itch.io banner</title>
<style>
  @font-face { font-family: VT323; src: url('../../Assets/Art/UI/Pixel/VT323-Regular.ttf'); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 960px; height: 394px; overflow: hidden; background: #000; }
  main { position: relative; width: 960px; height: 394px; isolation: isolate; background: #ed4231; }
  .landscape { position: absolute; inset: -65px 0 -30px; }
  .landscape img { position: absolute; width: 100%; height: 100%; image-rendering: pixelated; filter: grayscale(1) contrast(1.35); mix-blend-mode: multiply; }
  .foreground { filter: grayscale(1) brightness(.35) !important; }
  .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, transparent 20%, #0008 73%, #000 100%), linear-gradient(transparent 68%, #000); }
  h1 { position: absolute; inset: 116px 0 auto; margin: 0; color: #fff8e8; text-align: center; font: 400 156px/.88 VT323, monospace; letter-spacing: 2px; -webkit-text-stroke: 2px #170c0b; paint-order: stroke fill; text-shadow: 6px 7px #170c0b; }
</style>
<main aria-label="Typing Hero: layered Japanese mountains and shrine in red light, framed by dark trees.">
  <div class="landscape" aria-hidden="true">
    <img src="../../Assets/Art/Environment/TinyPixelJapan/Sky.png" alt="">
    <img src="../../Assets/Art/Environment/TinyPixelJapan/Clouds.png" alt="">
    <img src="../../Assets/Art/Environment/TinyPixelJapan/Fuji.png" alt="">
    <img src="../../Assets/Art/Environment/TinyPixelJapan/Mountain_Back.png" alt="">
    <img src="../../Assets/Art/Environment/TinyPixelJapan/Mountain_Middle.png" alt="">
    <img src="../../Assets/Art/Environment/TinyPixelJapan/Mountain_Front.png" alt="">
    <img src="../../Assets/Art/Environment/TinyPixelJapan/Shrine_Multiple.png" alt="">
    <img src="../../Assets/Art/Environment/TinyPixelJapan/BackgroundTrees.png" alt="">
    <img class="foreground" src="../../Assets/Art/Environment/TinyPixelJapan/Ground.png" alt="">
    <img class="foreground" src="../../Assets/Art/Environment/TinyPixelJapan/Gras.png" alt="">
    <img class="foreground" src="../../Assets/Art/Environment/TinyPixelJapan/Trees.png" alt="">
  </div>
  <div class="shade"></div>
  <h1>TYPING HERO</h1>
</main>
</html>
